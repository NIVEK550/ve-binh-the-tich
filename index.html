function newExam(){
 const qsets=[s1Groups,s2Groups,s3Groups].map((groups)=>mix(groups.map((g)=>take(g)())));
 const oldSig=(()=>{try{return localStorage.getItem('ve-binh-the-tich-last-exam')||'';}catch(_){return '';}})();
 let signature=JSON.stringify(qsets.map(g=>g.map(q=>q.title)));
 if(signature===oldSig){qsets[1][0]=take(s2Groups[0])();signature=JSON.stringify(qsets.map(g=>g.map(q=>q.title)));}
 try{localStorage.setItem('ve-binh-the-tich-last-exam',signature);}catch(_){/*private mode*/}
 const m=take([1,2,3]),blocks=take([3,4,5,6]),size=take([200,250,300,500]);
 const need=m*1000+blocks*size;
 const boss=inp('boss',`Hành tinh cần ${fmtNum(need)} dm³ năng lượng. Kho hiện có ${m} m³. Mỗi khối bổ sung chứa ${size} dm³. Hỏi cần thêm bao nhiêu khối năng lượng?`,blocks,'khối',`Đổi ${m} m³ thành dm³, tính phần còn thiếu rồi chia cho ${size}.`,`${fmtNum(need)} − ${fmtNum(m*1000)} = ${fmtNum(blocks*size)} dm³. Cần ${fmtNum(blocks*size)} : ${size} = ${blocks} khối.`,'fuel');
 return {questionSets:qsets,bossQuestion:boss,examVersion:EXAM_VERSION};
}
function newRunId(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'run-'+Date.now()+'-'+Math.random().toString(36).slice(2,12);}
function gradeForStage(stage){const r=game.results.filter(x=>x.stage===stage);return r.reduce((s,x)=>s+x.points,0);}
function buildSubmission(){return {runId:game.runId,version:game.examVersion,name:game.name,className:game.className,studentCode:game.studentCode||'',startedAt:game.startedAt,finishedAt:game.finishedAt||new Date().toISOString(),durationSeconds:Math.max(0,Math.round((Date.parse(game.finishedAt||new Date().toISOString())-Date.parse(game.startedAt||new Date().toISOString()))/1000)),score:game.score,maxScore:140,correct:game.results.filter(r=>r.correct).length,total:13,stageScores:[0,1,2].map(gradeForStage),questions:game.results.map(r=>({id:r.id,stage:r.stage,title:r.title,expected:r.expected,answer:r.answer,correct:r.correct,hint:r.hint,attempts:r.attempts,points:r.points}))};}
let sending=false;
async function sendResults(){
 if(!RESULT_ENDPOINT || !/^https:\/\/script\.google\.com\/macros\/s\//.test(RESULT_ENDPOINT) || !game.bossDone || !game.runId){return;}
 if(sending || game.submissionStatus==='requested')return;
 sending=true;game.submissionStatus='sending';render();
 try{
  const payload=JSON.stringify(buildSubmission());
  // no-cors: yêu cầu được gửi nhưng trình duyệt KHÔNG đọc được kết quả xác nhận từ Apps Script.
  await fetch(RESULT_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams({payload}).toString(),keepalive:true});
  game.submissionStatus='requested';game.submissionAt=new Date().toISOString();
 }catch(err){game.submissionStatus='failed';}
 finally{sending=false;render();}
}

try{const saved=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(saved&&typeof saved==='object'&&['home','map','quiz','stageClear','boss','end'].includes(saved.screen)&&Array.isArray(saved.results)&&Array.isArray(saved.completedStages)){game={...initial(),...saved};if(game.hasStarted && (!Array.isArray(game.questionSets)||game.questionSets.length!==3||!game.bossQuestion))game=initial();}}catch(e){}
const escapeHTML=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function currentQuestion(){return game.screen==='boss'?game.bossQuestion:game.questionSets[game.stageIndex][game.questionIndex];}

function audio(ok=true){if(!game.soundOn)return;try{const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;const ac=new Context(),o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=ok?690:260;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.085,ac.currentTime+.017);o.frequency.exponentialRampToValueAtTime(ok?980:210,ac.currentTime+.14);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.25);o.start();o.stop(ac.currentTime+.26);o.onended=()=>ac.close();}catch(e){}}

function header(){return `<header class="topbar"><button class="brand" data-action="home" aria-label="Về trang chủ"><span class="brand-icon">🧊</span><span><strong>VỆ BINH THỂ TÍCH</strong><small>TOÁN LỚP 5 · KHÁM PHÁ VŨ TRỤ</small></span></button><div class="header-right">${game.screen!=='home'?`<div class="head-score"><span class="score-star">★</span> ${fmt(game.score)} <span class="muted-header">điểm</span></div>`:''}<button class="round-icon" data-action="sound" title="${game.soundOn?'Tắt':'Bật'} âm thanh" aria-label="${game.soundOn?'Tắt':'Bật'} âm thanh">${game.soundOn?'🔊':'🔇'}</button><button class="round-icon" data-action="rules" title="Luật chơi" aria-label="Xem luật chơi">❔</button></div></header>`}
function homeScreen(){return `<main><div class="home-layout"><section class="home-copy"><span class="pill">🚀 HÀNH TRÌNH HỌC TOÁN ĐẦY KỲ THÚ</span><h1>VỆ BINH <span>THỂ TÍCH</span></h1><div class="lead">Giải cứu hành tinh Cube cùng robot đồng hành!</div><p class="description">Ba hành tinh bị mất pha lê năng lượng. Em hãy nhận diện đơn vị <strong>cm³, dm³, m³</strong>, vượt qua cỗ máy đổi đơn vị và giải những bài toán thú vị để khôi phục vũ trụ.</p><div class="student-meta"><div class="name-field"><label for="className">Lớp (bắt buộc)</label><input id="className" maxlength="16" placeholder="Ví dụ: 5/3" value="${escapeHTML(game.className)}"></div><div class="name-field"><label for="studentCode">Mã học sinh (nên có để không trùng tên)</label><input id="studentCode" maxlength="20" placeholder="Ví dụ: HS08" value="${escapeHTML(game.studentCode)}"></div></div><div class="home-form"><div class="name-field"><label for="playerName">Tên hoặc biệt danh phi hành gia</label><input id="playerName" maxlength="24" autocomplete="nickname" placeholder="Ví dụ: Minh Anh" value="${escapeHTML(game.name)}"></div><button class="btn btn-primary" data-action="start">🚀 Bắt đầu</button></div><p class="data-note">🛡️ Trò chơi chỉ dùng tên/biệt danh, lớp và mã học sinh để nhận diện lượt làm bài; không yêu cầu email hay số điện thoại. Kết quả chỉ được gửi đến bảng điểm giáo viên khi đã kết nối Google Sheets.</p><div class="home-bottom">${game.hasStarted?`<button class="btn btn-soft" data-action="resume">▶ Tiếp tục hành trình đã lưu</button>`:''}<button class="small-link" data-action="rules">📖 Cách chơi</button><div class="feature-icons"><span>✓ Không giới hạn thời gian</span><span>✓ Câu hỏi thay đổi mỗi lượt</span></div></div></section><section class="visual-stage">${heroSVG()}<div class="hero-tag">✨ 1 dm³ = 1 000 cm³</div></section></div><div class="home-stats"><div class="stat-card"><span class="emoji">🪐</span><div><b>3 hành tinh</b><p>Khám phá từ dễ đến khó</p></div></div><div class="stat-card"><span class="emoji">🧠</span><div><b>12 câu/đề</b><p>Đề mới được tạo sau mỗi lần bắt đầu</p></div></div><div class="stat-card"><span class="emoji">🏆</span><div><b>4 huy hiệu</b><p>Thu thập và mở khóa phần thưởng</p></div></div></div></main>`}
function mapScreen(){const stageCards=STAGES.map((s,i)=>{const done=game.completedStages.includes(i),ready=i<=game.completedStages.length;return `<article class="level-card ${s.color} ${ready?'':'locked'}"><div class="level-sky"><div class="planet"><div class="planet-ring"></div><span>${s.emoji}</span></div></div><div class="level-body"><span class="level-index">MÀN ${i+1} · ${escapeHTML(s.skill)}</span><h2>${escapeHTML(s.title)}</h2><p>${escapeHTML(s.description)}</p>${done?`<div class="mini-complete">✓ Đã nhận ${escapeHTML(s.prize)}</div>`:ready?`<button class="btn btn-primary" data-action="enter-stage" data-stage="${i}">🚀 Khám phá màn ${i+1} →</button>`:`<div style="min-height:48px"></div>`}</div>${!ready?'<div class="locked-tag">🔒 Hoàn thành màn trước để mở</div>':''}</article>`}).join('');return `<main><div class="section-head"><span class="eyebrow">BẢN ĐỒ NHIỆM VỤ</span><h1>Chọn hành tinh để khám phá 🪐</h1><p>Chào ${escapeHTML(game.name||'Phi hành gia nhí')}! Hãy hoàn thành lần lượt ba hành tinh để thu hồi tất cả pha lê năng lượng.</p></div><div class="overview-pill"><span>💎 Pha lê: ${game.completedStages.length}/3</span><span>⭐ Điểm hiện tại: ${fmt(game.score)}</span><span>🧩 4 câu hỏi ngẫu nhiên / màn</span></div><div class="map-grid">${stageCards}</div>${game.completedStages.length===3?`<div class="action-row"><button class="btn btn-primary" data-action="enter-boss">⚡ Kích hoạt thử thách cuối →</button></div>`:''}</main>`}
function visual(v){let content='';if(v==='tiny')content=`<div class="obj-visual"><div class="obj-symbol">🧊</div><div class="obj-caption">Khối lập phương cạnh 1 cm</div></div>${cubeSVG()}`;else if(v==='box')content=`${cubeSVG()}<div class="obj-visual"><div class="obj-caption">Hình lập phương</div><div style="font-size:18px;color:#4356b4;font-weight:950">Cạnh: ${game.stageIndex===2?'10 cm':'1 dm'}</div></div>`;else if(v==='room')content=`<div class="obj-visual"><div class="obj-symbol">🏠</div><div class="obj-caption">Không gian bên trong căn phòng</div></div>`;else if(v==='m-dm'||v==='dm-cm'||v==='chain'){const units=v==='m-dm'?['m³','dm³']:v==='dm-cm'?['dm³','cm³']:['m³','dm³','cm³'];content=`<div class="conversion-line">${units.map((u,i)=>`${i?'<div class="unit-arrow">→<small>× 1 000</small></div>':''}<div class="unit-box">${u}</div>`).join('')}</div>`;}else if(v==='fuel')content=`<div class="obj-visual"><div class="obj-symbol">🔋 ⚡</div><div class="obj-caption">Trạm nhiên liệu vũ trụ</div></div>`;else if(v==='boxes')content=`<div class="obj-visual"><div class="obj-symbol">📦 📦 📦 📦</div><div class="obj-caption">Bốn hộp chứa năng lượng</div></div>`;else if(v==='tank')content=`<div class="obj-visual"><div class="obj-symbol">🛢️ 💧</div><div class="obj-caption">Tính lượng nước còn thiếu</div></div>`;else content='<div class="obj-visual"><div class="obj-symbol">🔎 💎</div><div class="obj-caption">Tìm đơn vị thích hợp</div></div>';return `<div class="quiz-visual"><div class="visual-dots"></div>${content}</div>`}
function matchBoard(q){const targets=['m³','cm³','dm³'];const matched=new Set(game.matched);return `<p class="pair-instructions">Chạm vào một vật ở cột trái, rồi chọn đúng đơn vị ở cột phải.</p><div class="match-board"><div class="match-col"><div class="match-col-head">Vật thể</div>${q.items.map((it,i)=>`<button class="match-item ${matched.has(i)?'done':game.matchPick===i?'chosen':''}" data-action="pick-match" data-index="${i}" ${matched.has(i)||game.phase!=='asking'?'disabled':''}><span class="micon">${it.icon}</span>${escapeHTML(it.name)} ${matched.has(i)?'✓':''}</button>`).join('')}</div><div class="match-col"><div class="match-col-head">Đơn vị</div>${targets.map((t)=>`<button class="match-item unit ${q.items.some((it,i)=>matched.has(i)&&it.target===t)?'done':''}" data-action="target-match" data-target="${t}" ${q.items.some((it,i)=>matched.has(i)&&it.target===t)||game.phase!=='asking'?'disabled':''}>${t} ${q.items.some((it,i)=>matched.has(i)&&it.target===t)?'✓':''}</button>`).join('')}</div></div><div class="match-count">🔗 Đã ghép đúng ${game.matched.length}/3 cặp</div>`}
function questionBody(q){let content='';if(q.type==='choice'){content=`<div class="answers" role="group" aria-label="Chọn đáp án">${q.options.map((answer,i)=>`<button class="answer-option ${game.selected===i?'selected':''}" data-action="choose" data-index="${i}" ${game.phase!=='asking'?'disabled':''} aria-pressed="${game.selected===i}"><span class="answer-letter">${'ABC'[i]}</span>${escapeHTML(answer)}</button>`).join('')}</div>`}else if(q.type==='input'){content=`<label class="sr-only" for="answerInput">Nhập đáp án bằng số</label><div class="enter-row"><input id="answerInput" class="answer-input" type="text" inputmode="decimal" autocomplete="off" placeholder="Nhập đáp án..." value="${escapeHTML(game.input)}" ${game.phase!=='asking'?'disabled':''}><div class="input-unit">${escapeHTML(q.unit)}</div></div><p class="help-text">💡 Chỉ nhập số, không cần nhập đơn vị. Nhấn Enter để kiểm tra.</p>`}else{content=matchBoard(q)}
 let feedback='';if(game.phase==='correct'){const record=game.results[game.results.length-1];feedback=`<div class="feedback-box ok" role="status"><div class="feedback-heading">🎉 Chính xác! +${record.points} điểm</div><p>${escapeHTML(q.explanation)}</p></div>`}else if(game.phase==='review'){feedback=`<div class="feedback-box review" role="status"><div class="feedback-heading">📘 Cùng xem cách giải nhé!</div><p>${escapeHTML(q.explanation)} Em có thể thử lại hoặc tiếp tục để luyện tập câu mới.</p></div>`}else if(game.feedback){feedback=`<div class="feedback-box try" role="status"><div class="feedback-heading">💪 Chưa đúng rồi, thử lại nhé!</div><p>${escapeHTML(game.feedback)}</p></div>`}
 const hint=game.hintUsed&&game.phase==='asking'?`<div class="hint-box" role="status"><strong>💡 Gợi ý từ Robot Cube:</strong><br>${escapeHTML(q.hint)}</div>`:'';
 const canSubmit=q.type==='choice'?game.selected!==null:q.type==='input'?game.input.trim().length>0:false;
 let actions='';if(game.phase==='correct'){actions=`<button class="btn btn-primary" data-action="next">${game.screen==='boss'?'Xem thành tích 🏆':game.questionIndex===3?'Nhận pha lê 💎':'Câu tiếp theo →'}</button>`}else if(game.phase==='review'){actions='<button class="btn btn-outline" data-action="retry">↺ Thử lại</button><button class="btn btn-primary" data-action="skip">Đã hiểu, tiếp tục →</button>'}else{actions=`<button class="help-btn" data-action="hint" ${game.hintUsed?'disabled':''}>💡 ${game.hintUsed?'Đã dùng gợi ý':'Nhận gợi ý'}</button>${q.type==='match'?'<span style="color:#7380a0;font-size:12px;font-weight:800">Ghép đủ ba cặp để hoàn thành</span>':`<button class="btn btn-primary" data-action="check" ${!canSubmit?'disabled':''}>Kiểm tra đáp án ✓</button>`}`}
 return `<article class="question-card"><div class="question-top"><span class="number">${game.screen==='boss'?'THỬ THÁCH CUỐI':`CÂU HỎI ${game.questionIndex+1} / 4`}</span><span class="skill">${game.screen==='boss'?'🌟 Tổng hợp':escapeHTML(STAGES[game.stageIndex].skill)}</span></div><h1 class="problem-heading">${escapeHTML(q.title)}</h1>${q.type==='match'?'':visual(q.visual)}${content}${hint}${feedback}<div class="quiz-actions">${actions}</div></article>`}
function quizScreen(){const boss=game.screen==='boss';const s=boss?{title:'Kích Hoạt Hành Tinh Cube',short:'Thử thách cuối',talk:'Tổng hợp toàn bộ kiến thức. Đừng quên đổi về cùng đơn vị trước khi tính!'}:STAGES[game.stageIndex],question=currentQuestion();const width=boss?100:(game.questionIndex/4)*100;return `<main><div class="stage-meta"><button class="back-btn" data-action="map">← Bản đồ nhiệm vụ</button><span class="stage-badge">${boss?'🏆 THỬ THÁCH CUỐI':`🪐 MÀN ${game.stageIndex+1} / 3`}</span></div><div class="progress-outer" aria-label="Tiến trình màn chơi"><div class="progress-inner" style="width:${width}%"></div></div><div class="quiz-layout">${questionBody(question)}<aside class="sidebar"><section class="aside-card bot-card"><h3>🤖 ROBOT CUBE ĐỒNG HÀNH</h3><div class="bot-circle">🤖</div><div class="robot-speech">${escapeHTML(s.talk)}</div></section><section class="aside-card"><h3>⚡ Năng lượng nhiệm vụ</h3><div class="golden">${boss?'12 / 12':`${game.questionIndex} / 4`} <span style="font-size:12px;color:#d4ddff">câu đã hoàn thành</span></div><div class="mini-progress">${Array.from({length:boss?1:4},(_,i)=>`<i class="${boss||i<game.questionIndex?'active':''}"></i>`).join('')}</div><p class="legend" style="margin-top:15px">🌟 Đúng ngay: <strong>+${boss?20:10}</strong><br>💡 Có gợi ý: <strong>+${boss?10:5}</strong><br>❤️ Sai không bị trừ điểm</p></section>${boss?'':`<section class="aside-card"><h3>🧠 Mẹo cần nhớ</h3><p class="legend">1 m³ = 1 000 dm³<br>1 dm³ = 1 000 cm³<br><br>Từ lớn sang nhỏ: <strong>× 1 000</strong><br>Từ nhỏ sang lớn: <strong>÷ 1 000</strong></p></section>`}</aside></div></main>`}
function stageClearScreen(){const s=STAGES[game.stageIndex],count=game.results.filter(r=>r.stage===game.stageIndex&&r.correct).length;return `<main class="celebration"><span class="eyebrow">NHIỆM VỤ HOÀN THÀNH</span><div class="big-prize">💎</div><div class="clear-copy"><h1>Xuất sắc, ${escapeHTML(game.name)}! 🎉</h1><p>Em đã vượt qua <strong>${escapeHTML(s.title)}</strong> và thu hồi thành công một viên pha lê năng lượng.</p></div><div class="clear-badge"><div style="font-size:36px">${s.emoji} ⭐</div><b>Huy hiệu: ${escapeHTML(s.short)}</b><p>${count}/4 câu trả lời đúng · Tổng cộng ${fmt(game.score)} điểm</p></div><div class="clear-footer"><button class="btn btn-soft" data-action="map">🗺️ Xem bản đồ</button><button class="btn btn-primary" data-action="continue">${game.stageIndex===2?'⚡ Đến thử thách cuối':'🚀 Đến hành tinh tiếp theo'} →</button></div></main>`}
function endScreen(){const correct=game.results.filter(r=>r.correct).length;const numHints=game.results.filter(r=>r.hint).length;const bossSuccess=game.results.some(r=>r.id==='boss'&&r.correct);const max=140;const pct=Math.round(game.score/max*100);const rank=pct>=90?'Vệ Binh Xuất Sắc':pct>=65?'Vệ Binh Tài Năng':'Vệ Binh Kiên Trì';const tips=game.results.some(r=>!r.correct)?'Một vài câu vẫn cần luyện thêm. Em hãy xem lại lời giải và quy tắc gấp hoặc kém nhau 1 000 lần.':'Em đã hoàn thành mọi thử thách! Hãy giải thích cho bạn vì sao 1 m³ = 1 000 000 cm³ nhé.';const sync=(!RESULT_ENDPOINT)?'<p class="sync-text">📘 Giáo viên chưa kết nối Google Sheets. Kết quả hiện chỉ lưu trên trình duyệt này.</p>':game.submissionStatus==='requested'?'<p class="sync-text good">📨 Đã gửi yêu cầu lưu kết quả. Trình duyệt không xác nhận trực tiếp được việc ghi vào Sheets — giáo viên hãy kiểm tra bảng điểm.</p><button class="btn btn-outline" data-action="send-results">↻ Gửi lại nếu bảng điểm chưa có</button>':game.submissionStatus==='sending'?'<p class="sync-text">⏳ Đang gửi kết quả...</p>':`<p class="sync-text warn">${game.submissionStatus==='failed'?'⚠️ Có lỗi mạng khi gửi kết quả.':'📤 Kết quả chưa được gửi.'} Hãy nhấn nút Gửi lại.</p><button class="btn btn-secondary" data-action="send-results">📨 Gửi kết quả cho giáo viên</button>`;return `<main class="end-section"><span class="eyebrow">${bossSuccess?'HÀNH TINH CUBE ĐÃ ĐƯỢC GIẢI CỨU':'HÀNH TRÌNH ĐÃ HOÀN THÀNH'}</span><div class="big-prize">${bossSuccess?'🏆':'🌟'}</div><div class="end-copy"><h1>${bossSuccess?'Chúc mừng':'Làm tốt lắm'}, ${escapeHTML(game.name)}!</h1><p>${bossSuccess?'Ba viên pha lê đã được khôi phục. Hành tinh Cube lại tỏa sáng!':'Em đã thu thập đủ ba pha lê. Hãy luyện tập thêm câu cuối trong lần chơi tiếp theo nhé!'}</p></div><div class="result-card"><span class="eyebrow" style="color:#6a6ed1">DANH HIỆU CỦA EM</span><h2 style="margin:11px 0;color:#263568">${rank} ✨</h2><div class="result-total">${fmt(game.score)} <small>/ ${max} điểm</small></div><div class="result-grid"><div class="result-unit">✅<strong>${correct}/13</strong><small>Câu giải đúng</small></div><div class="result-unit">💡<strong>${numHints}</strong><small>Câu có gợi ý</small></div><div class="result-unit">💎<strong>3/3</strong><small>Pha lê thu thập</small></div></div><div class="teacher-note"><strong>📚 Điểm từng màn:</strong> Nhận biết ${gradeForStage(0)}/40 · Chuyển đổi ${gradeForStage(1)}/40 · Vận dụng ${gradeForStage(2)}/40.<br><br><strong>🤖 Robot Cube:</strong> ${tips}<br><br><strong>Ghi nhớ:</strong> 1 m³ = 1 000 dm³ = 1 000 000 cm³.</div><div class="sync-panel"><strong>📊 Sổ theo dõi kết quả</strong><p class="sync-person">${escapeHTML(game.name)} · Lớp ${escapeHTML(game.className)}${game.studentCode?' · Mã '+escapeHTML(game.studentCode):''}</p>${sync}</div></div><div class="action-row"><button class="btn btn-primary" data-action="restart">↻ Làm đề mới</button><button class="btn btn-soft" data-action="print">🖨️ In kết quả</button></div></main>`}
function rulesModal(){if(!game.showRules)return '';return `<div class="modal-wrap" data-action="close-overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="rulesTitle"><div class="modal-header"><h2 id="rulesTitle">🚀 Hướng dẫn chơi</h2><button class="modal-close" data-action="close-rules" aria-label="Đóng">×</button></div><p>Em là một Vệ Binh Thể Tích. Vượt qua <strong>3 hành tinh × 4 thử thách</strong> để nhận ba viên pha lê, sau đó hoàn thành nhiệm vụ cuối để cứu hành tinh Cube.</p><ul><li><strong>Màn 1:</strong> Nhận biết đơn vị cm³, dm³, m³ và ghép vật thể.</li><li><strong>Màn 2:</strong> Chuyển đổi đơn vị. Hai đơn vị liền kề hơn kém nhau <strong>1 000 lần</strong>.</li><li><strong>Màn 3:</strong> Giải bài toán thể tích trong thực tế.</li><li><strong>Điểm:</strong> Đúng ngay +10, đúng lần hai +7, đúng sau gợi ý +5. Thử thách cuối tối đa +20.</li><li><strong>Trả lời sai:</strong> Không trừ điểm. Sau hai lần chưa đúng, em được xem lời giải hoặc thử lại.</li></ul><p>Chạm hoặc bấm vào đáp án, rồi chọn <strong>Kiểm tra đáp án</strong>. Với câu ghép cặp, hãy lần lượt chọn vật thể và đơn vị. Có thể nhấn <span class="kbd">Enter</span> sau khi nhập số.</p><button class="btn btn-primary" data-action="close-rules" style="width:100%">Đã hiểu, bắt đầu thôi! ✨</button></div></div>`}
function render(){let screen='';switch(game.screen){case 'map':screen=mapScreen();break;case 'quiz':case 'boss':screen=quizScreen();break;case 'stageClear':screen=stageClearScreen();break;case 'end':screen=endScreen();break;default:screen=homeScreen();}app.innerHTML=header()+screen+'<div class="footnote">Toán 5 · Học qua trải nghiệm · Mỗi lượt chơi một bộ câu hỏi mới · Kết quả gửi đi khi có kết nối</div>'+rulesModal();persist();}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function begin(){const name=(document.getElementById('playerName')?.value||'').trim().slice(0,24);const className=(document.getElementById('className')?.value||'').trim().slice(0,16);const studentCode=(document.getElementById('studentCode')?.value||'').trim().slice(0,20);if(!name||!className){alert('Em hãy nhập tên hoặc biệt danh và lớp trước khi bắt đầu nhé!');return;}const sound=game.soundOn;game=initial();Object.assign(game,newExam(),{name,className,studentCode,runId:newRunId(),startedAt:new Date().toISOString(),soundOn:sound,hasStarted:true,screen:'map'});render();scrollTop();}
function enterStage(i){if(i<0||i>2||game.completedStages.includes(i)||i>game.completedStages.length)return;if(game.activeStage!==i){game.stageIndex=i;game.questionIndex=0;resetAnswer();}game.activeStage=i;game.screen='quiz';render();scrollTop();}
function parseNumber(v){let s=String(v).trim().replace(/\s/g,'');if(!s)return NaN;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');return /^-?\d+(\.\d+)?$/.test(s)?Number(s):NaN;}
function answerText(q){if(q.type==='choice')return q.options[game.selected]||game.lastAnswer||'';if(q.type==='match')return 'Đã ghép '+game.matched.length+'/3 cặp';return game.input||game.lastAnswer||'';}
function correctText(q){if(q.type==='choice')return q.options[q.correct];if(q.type==='match')return q.items.map(it=>it.name+': '+it.target).join('; ');return String(q.correct)+' '+(q.unit||'');}
function finishQuestion(correct){const q=currentQuestion();const points=correct?(game.hintUsed?(game.screen==='boss'?10:5):game.attempts===0?(game.screen==='boss'?20:10):(game.screen==='boss'?(game.attempts===1?14:10):(game.attempts===1?7:5))):0;game.score+=points;game.results.push({id:q.id,title:q.title,answer:answerText(q),expected:correctText(q),stage:game.screen==='boss'?'boss':game.stageIndex,correct,points,hint:game.hintUsed,attempts:game.attempts});game.phase='correct';game.feedback='';audio(correct);render();}
function onWrong(){const q=currentQuestion();game.lastAnswer=answerText(q);game.attempts++;game.selected=null;game.feedback='Hãy kiểm tra lại đơn vị hoặc phép tính. Em có thể dùng gợi ý của Robot Cube.';audio(false);if(game.attempts>=2)game.phase='review';render();}
function checkAnswer(){if(game.phase!=='asking')return;const q=currentQuestion();if(q.type==='match')return;let ok=false;if(q.type==='choice'){if(game.selected===null)return;ok=game.selected===q.correct;}else{if(!game.input.trim())return;ok=parseNumber(game.input)===q.correct;}if(ok)finishQuestion(true);else onWrong();}
function next(){if(game.phase!=='correct')return;if(game.screen==='boss'){game.bossDone=true;game.finishedAt=new Date().toISOString();game.screen='end';resetAnswer();render();sendResults();scrollTop();return;}if(game.questionIndex===3){if(!game.completedStages.includes(game.stageIndex))game.completedStages.push(game.stageIndex);game.screen='stageClear';game.activeStage=null;resetAnswer();render();scrollTop();}else{game.questionIndex++;resetAnswer();render();scrollTop();}}
function skip(){if(game.phase!=='review')return;const q=currentQuestion();game.results.push({id:q.id,title:q.title,answer:game.lastAnswer||'Bỏ qua',expected:correctText(q),stage:game.screen==='boss'?'boss':game.stageIndex,correct:false,points:0,hint:game.hintUsed,attempts:game.attempts});if(game.screen==='boss'){game.bossDone=true;game.finishedAt=new Date().toISOString();game.screen='end';resetAnswer();}else if(game.questionIndex===3){if(!game.completedStages.includes(game.stageIndex))game.completedStages.push(game.stageIndex);game.screen='stageClear';game.activeStage=null;resetAnswer();}else{game.questionIndex++;resetAnswer();}render();if(game.bossDone)sendResults();scrollTop();}
function resume(){if(game.screen==='home'&&game.hasStarted){game.screen=game.bossDone?'end':'map';render();scrollTop();}}
function toMap(){game.screen='map';render();scrollTop();}
function restart(){if(!window.confirm('Em muốn làm một đề mới? Kết quả lượt cũ vẫn ở Google Sheets nếu đã gửi.'))return;const n=game.name,s=game.soundOn,c=game.className,id=game.studentCode;game=initial();Object.assign(game,{name:n,className:c,studentCode:id,soundOn:s,screen:'home'});render();scrollTop();}
app.addEventListener('click',function(ev){const b=ev.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(action==='close-overlay'&&ev.target!==b)return;switch(action){case 'home':game.screen='home';render();scrollTop();break;case 'rules':game.showRules=true;render();break;case 'close-rules':case 'close-overlay':game.showRules=false;render();break;case 'sound':game.soundOn=!game.soundOn;render();break;case 'start':begin();break;case 'resume':resume();break;case 'map':toMap();break;case 'enter-stage':enterStage(Number(b.dataset.stage));break;case 'choose':if(game.phase==='asking'){game.selected=Number(b.dataset.index);game.feedback='';render();}break;case 'check':checkAnswer();break;case 'hint':if(game.phase==='asking'&&!game.hintUsed){game.hintUsed=true;render();}break;case 'retry':if(game.phase==='review'){game.phase='asking';game.feedback='';game.selected=null;game.input='';game.matchPick=null;render();}break;case 'skip':skip();break;case 'next':next();break;case 'continue':if(game.stageIndex===2){game.screen='boss';resetAnswer();render();scrollTop();}else enterStage(game.stageIndex+1);break;case 'enter-boss':if(game.completedStages.length===3){game.screen='boss';resetAnswer();render();scrollTop();}break;case 'pick-match':if(game.phase==='asking'){game.matchPick=Number(b.dataset.index);game.feedback='';render();}break;case 'target-match':if(game.phase==='asking'&&game.matchPick!==null){const q=currentQuestion(),i=game.matchPick;if(q.type!=='match')return;if(q.items[i].target===b.dataset.target){game.matched.push(i);game.matchPick=null;game.feedback='';if(game.matched.length===q.items.length)finishQuestion(true);else{audio(true);render();}}else{game.matchPick=null;onWrong();}}break;case 'restart':restart();break;case 'send-results':if(game.submissionStatus==='requested')game.submissionStatus='idle';sendResults();break;case 'print':window.print();break;}});
app.addEventListener('input',function(e){if(e.target.id==='answerInput'){game.input=e.target.value;const button=app.querySelector('[data-action="check"]');if(button)button.disabled=!game.input.trim();}if(e.target.id==='playerName'){game.name=e.target.value.slice(0,24);}if(e.target.id==='className')game.className=e.target.value.slice(0,16);if(e.target.id==='studentCode')game.studentCode=e.target.value.slice(0,20);});
app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='answerInput'){e.preventDefault();checkAnswer();}if(e.key==='Enter'&&['playerName','className','studentCode'].includes(e.target.id)){e.preventDefault();begin();}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&game.showRules){game.showRules=false;render();}});
if(game.screen==='end'&&!game.bossDone)game.screen='map';
render();
})();
</script>
</body>
</html>
